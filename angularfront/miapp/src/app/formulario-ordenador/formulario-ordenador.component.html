<h2 class="text-body-primary">Formulario de Ordenadores</h2>
<form>
    <div class="mb-3">
        <label for="modelo" class="form-label">Modelo</label>
       <input type="text" class="form-control" id="modelo" name="modelo" [(ngModel)]="ordenador.modelo" placeholder="ingrese el modelo" required>
    </div>
    <div class="mb-3">
        <label for="modelo" class="form-label">Marca</label>
       <input type="text" class="form-control" id="marca" name="marca"[(ngModel)]="ordenador.marca" placeholder="ingrese el nombre del marca" required>
    </div>
    <div class="mb-3">
        <label for="modelo" class="form-label">Precio</label>
       <input type="text" class="form-control" id="precio" name="precio" [(ngModel)]="ordenador.precio"placeholder="ingrese el precio" required>
    </div>
    <div class="mb-3">
        <label for="modelo" class="form-label">Num Serie</label>
       <input type="text" class="form-control" id="numserie" name="numserie" [(ngModel)]="ordenador.numserie" placeholder="ingrese el numero de numserie" required>
    </div>
    <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-primary"(click)="insertar()">Guardar</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>
    </div>
</form>
